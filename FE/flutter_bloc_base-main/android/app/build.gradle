plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
}

// Configure Flutter plugin source path for the new Gradle plugin
flutter {
    // Path to the Flutter project root (contains pubspec.yaml)
    source = "../.."
}

android {
    namespace "com.flutter.nextai"
    // camera_android requires compileSdk 36. Use the higher SDK to remain compatible with plugins.
    compileSdk = 36

    // ----- BEGIN flavorDimensions (autogenerated by flutter_flavorizr) -----
    flavorDimensions += "flavor-type"

    productFlavors {
        dev {
            dimension "flavor-type"
            applicationId "com.flutter.nextai.dev"
            resValue "string", "app_name", "Yoga Detection"
        }
        staging {
            dimension "flavor-type"
            applicationId "com.flutter.nextai.stg"
            resValue "string", "app_name", "Yoga Detection"
        }
        production {
            dimension "flavor-type"
            applicationId "com.flutter.nextai"
            resValue "string", "app_name", "Yoga Detection"
        }
    }

    // ----- END flavorDimensions (autogenerated by flutter_flavorizr) -----

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.flutter.nextai"
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    // Kotlin stdlib provided via plugin; add your libs below if needed
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
