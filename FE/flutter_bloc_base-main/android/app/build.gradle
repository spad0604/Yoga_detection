plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

// Configure Flutter plugin source path for the new Gradle plugin
flutter {
    // Path to the Flutter project root (contains pubspec.yaml)
    source = "../.."
}

android {
    namespace "com.flutter.nextai"
    // camera_android requires compileSdk 36. Use the higher SDK to remain compatible with plugins.
    compileSdk = 36

    // ----- BEGIN flavorDimensions (autogenerated by flutter_flavorizr) -----
    flavorDimensions += "flavor-type"

    productFlavors {
        dev {
            dimension "flavor-type"
            applicationId "com.flutter.nextai.dev"
            resValue "string", "app_name", "[Dev] NextAi"
        }
        staging {
            dimension "flavor-type"
            applicationId "com.flutter.nextai.stg"
            resValue "string", "app_name", "[Stg] NextAi"
        }
        production {
            dimension "flavor-type"
            applicationId "com.flutter.nextai"
            resValue "string", "app_name", "NextAi"
        }
    }

    // ----- END flavorDimensions (autogenerated by flutter_flavorizr) -----

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.flutter.nextai"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    // Kotlin stdlib provided via plugin; add your libs below if needed
}
